<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研发知识库助手</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/hl-github-dark.css">
<script>
(function () {
  var t = null; try { t = localStorage.getItem('kb_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{--bg:#1a1a1c;--panel:#202023;--panel2:#2a2a2e;--elev:#252528;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#ececee;--text2:#cfd0d4;--sub:#8e8f96;
  --accent:#5b9dff;--accent-soft:rgba(91,157,255,.16);--accent-text:#9cc2ff;--hover:rgba(255,255,255,.08);--hover2:rgba(255,255,255,.12);--good:#3fb950;--bad:#f85149;--gold:#e3b341;
  --code-bg:#141416;--code-head:#1d1d20;--shadow:0 2px 8px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.28);--shadow-lg:0 24px 64px rgba(0,0,0,.5);--mask:rgba(0,0,0,.5);
  --r1:8px;--r2:12px;--r3:16px;color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
:root[data-theme="light"]{--bg:#ffffff;--panel:#f7f7f8;--panel2:#eeeef0;--elev:#ffffff;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--text:#1d1d1f;--text2:#3a3a3c;--sub:#86868b;
  --accent:#2f6fdf;--accent-soft:rgba(47,111,223,.1);--accent-text:#2f6fdf;--hover:rgba(0,0,0,.05);--hover2:rgba(0,0,0,.08);
  --code-bg:#1e1e21;--code-head:#2a2a2e;--shadow:0 1px 4px rgba(0,0,0,.06),0 8px 28px rgba(0,0,0,.08);--shadow-lg:0 24px 64px rgba(0,0,0,.18);--mask:rgba(0,0,0,.3);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:var(--r1);transition:background .15s,color .15s}
button:hover{background:var(--hover)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--hover2);border-radius:8px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:100vh;position:relative}
/* 左侧栏：历史 / 收藏 / 榜单 */
.side{width:268px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .25s ease,transform .25s ease}
.side.closed{margin-left:-268px}
.brand{display:flex;align-items:center;gap:8px;padding:14px 14px 4px}
.brand img{width:24px;height:24px;flex:none}
.brand b{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-head{display:flex;align-items:center;gap:6px;padding:10px 12px}
.side-head .new{flex:1;display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border:1px solid var(--line);background:var(--elev);border-radius:var(--r2)}
.side-head .new:hover{background:var(--hover)}
.side-head .new svg{width:16px;height:16px}
.tabs{display:flex;gap:2px;margin:0 12px 8px;padding:3px;background:var(--hover);border-radius:var(--r1)}
.tabs button{flex:1;padding:5px 0;color:var(--sub);font-size:13px;border-radius:6px}
.tabs button.on{color:var(--text);background:var(--elev);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.list{flex:1;overflow:auto;padding:0 8px 12px}
.list .item{display:block;width:100%;text-align:left;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);font-size:13px}
.list .group{color:var(--sub);font-size:12px;padding:14px 10px 4px}
.list .rank{display:inline-block;width:20px;color:var(--sub)}
.list .rank.top{color:var(--gold);font-weight:600}
.list .meta{float:right;color:var(--sub);font-size:12px;margin-left:6px}
.list .empty{color:var(--sub);padding:16px 10px;font-size:13px}
.side-foot{padding:10px 16px 14px;font-size:11px;color:var(--sub);line-height:1.6;border-top:1px solid var(--line)}
.backdrop{display:none}
/* 主区域 */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;font-weight:600}
.top .grow{flex:1}
select{background:var(--elev);color:var(--text);border:1px solid var(--line);border-radius:var(--r1);padding:5px 8px;font:inherit;font-size:13px;outline:0}
select:hover{background:var(--hover)}
.seg{display:flex;background:var(--hover);border-radius:var(--r1);padding:2px}
.seg button{padding:4px 12px;color:var(--sub);font-size:13px;border-radius:6px}.seg button.on{background:var(--elev);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.icon{display:inline-flex;align-items:center;justify-content:center;padding:6px;color:var(--sub)}
.icon:hover{color:var(--text)}
.icon svg{width:18px;height:18px}
.body{flex:1;display:flex;min-height:0;position:relative}
.thread{flex:1;overflow:auto;padding:28px 0 180px;scroll-behavior:smooth}
.wrap{max-width:800px;margin:0 auto;padding:0 28px}
.welcome{text-align:center;margin-top:10vh;color:var(--sub)}
.welcome .hero{width:72px;height:72px;animation:glow 4.5s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(227,179,65,.25));transform:rotate(0deg) scale(1)}50%{filter:drop-shadow(0 0 16px rgba(91,157,255,.45));transform:rotate(8deg) scale(1.03)}}
.welcome h2{color:var(--text);font-weight:600;font-size:26px;margin:18px 0 8px;letter-spacing:.3px}
.welcome .subt{font-size:14px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px auto 0;max-width:640px;text-align:left}
.chips button{border:1px solid var(--line);background:var(--elev);padding:12px 14px;color:var(--text2);border-radius:var(--r2);line-height:1.5;font-size:13px;transition:background .15s,border-color .15s,transform .15s}
.chips button:hover{background:var(--hover);border-color:var(--line2);transform:translateY(-1px)}
.turn{margin-bottom:32px;scroll-margin-top:16px;animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.turn.old{animation:none}
.q{display:flex;justify-content:flex-end}
.q div{background:var(--panel2);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:80%;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.who{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;font-weight:600;color:var(--text2)}
.who img{width:22px;height:22px}
.a{margin-top:6px;line-height:1.75}
.md{word-break:break-word}
.md p{margin:.5em 0}.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .4em;font-size:15px}
.md ul,.md ol{padding-left:1.4em}.md li{margin:.2em 0}
.md a{color:var(--accent-text)}
.md code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
.codebox{margin:.8em 0;border-radius:var(--r2);overflow:hidden;background:var(--code-bg);border:1px solid var(--line)}
.codehead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 14px;background:var(--code-head);color:#9a9ba1;font-size:12px;font-family:"SF Mono",Menlo,Consolas,monospace}
.codehead button{color:#b8b9bf;font-size:12px;padding:3px 8px;display:flex;align-items:center;gap:4px;font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
.codehead button:hover{background:rgba(255,255,255,.1);color:#fff}
.codehead svg{width:13px;height:13px}
.md pre{background:var(--code-bg);border-radius:var(--r1);padding:12px 14px;overflow:auto;margin:0;color:#e6e6e8}
.codebox pre{border-radius:0}
.md pre code{background:none;padding:0;color:inherit}
.md pre code.hljs{background:none;padding:0}
.md table{border-collapse:collapse;margin:.6em 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line2);padding:6px 10px;text-align:left}.md th{background:var(--panel2)}
.md blockquote{margin:.6em 0;padding:2px 12px;border-left:3px solid var(--line2);color:var(--sub)}
.cite{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;margin:0 1px;font-size:11px;text-align:center;
  border-radius:9px;background:var(--accent-soft);color:var(--accent-text);cursor:pointer;vertical-align:1px;transition:background .15s}
.cite:hover{background:var(--accent);color:#fff}
.srcs{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.src{font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);padding:3px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color .2s,background .2s}
.src b{color:var(--accent-text);font-weight:500;margin-right:4px}.src.flash{border-color:var(--accent);background:var(--accent-soft)}
.bar{display:flex;align-items:center;gap:2px;margin-top:10px;color:var(--sub)}
.bar button{display:flex;align-items:center;gap:4px;padding:5px 7px;font-size:12px;color:var(--sub)}
.bar button:hover{color:var(--text)}
.bar button.on{color:var(--text)}.bar button.like.on{color:var(--good)}.bar button.dislike.on{color:var(--bad)}.bar button.fav.on{color:var(--gold)}
.bar svg{width:16px;height:16px}.bar .sp{flex:1}.bar .t{font-size:12px}
.typing{display:inline-flex;align-items:center;gap:5px;padding:10px 14px;background:var(--panel);border-radius:14px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sub);animation:b 1.3s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.err{color:var(--bad)}
/* 输入框 */
.composer{position:absolute;left:0;right:0;bottom:0;padding:12px 0 14px;background:linear-gradient(transparent,var(--bg) 32%);pointer-events:none}
.composer .wrap{pointer-events:auto}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--elev);border:1px solid var(--line2);border-radius:var(--r3);padding:12px 12px 12px 16px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--accent);box-shadow:var(--shadow),0 0 0 3px var(--accent-soft)}
.box textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:14.5px;max-height:180px;line-height:1.55;padding:5px 0}
.box textarea::placeholder{color:var(--sub)}
.box .send{width:34px;height:34px;flex:none;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:0}
.box .send:hover{opacity:.85;background:var(--text)}
.box .send svg{width:18px;height:18px}
.box .send:disabled{opacity:.35;cursor:default}
.box .send .spin{display:none;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
.box .send.busy .spin{display:block}.box .send.busy svg{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.hint{font-size:11.5px;color:var(--sub);margin:7px 4px 0;text-align:right}
.notice{color:var(--sub);font-size:11.5px;text-align:center;margin-top:4px;line-height:1.6}
.notice #notice{display:block;margin-top:2px}.notice #notice:empty{display:none}
.tobottom{position:absolute;left:50%;bottom:170px;transform:translateX(-50%) translateY(8px);width:34px;height:34px;border-radius:50%;background:var(--elev);border:1px solid var(--line2);
  box-shadow:var(--shadow);color:var(--text2);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:4}
.tobottom.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.tobottom:hover{background:var(--elev);color:var(--text)}
.tobottom svg{width:18px;height:18px}
/* 右侧：问题点轨（Trae 风格），悬停展开，可固定 */
.rail{width:28px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:20px 0}
.rail .dot{width:6px;height:6px;border-radius:50%;background:var(--line2);padding:0}
.rail .dot:hover{background:var(--sub)}
.rail .dot.cur{background:var(--text);width:8px;height:8px}
.rail:hover .pop,.pop:hover{display:block}
.pop{display:none;position:absolute;right:26px;top:50%;transform:translateY(-50%);width:300px;max-height:70vh;overflow:auto;background:var(--elev);
  border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow-lg);padding:6px;z-index:5}
.pop-head,.dock-head{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:12px;padding:4px 8px 6px}
.qitem{display:block;width:100%;text-align:left;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);font-size:13px}
.qitem.cur{background:var(--hover);color:var(--text)}
.dock{width:260px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px 6px;display:none}
.pinned .dock{display:block}.pinned .rail{display:none}
.pinbtn svg{width:14px;height:14px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,20,22,.92);color:#fff;padding:7px 16px;border-radius:var(--r2);font-size:13px;display:none;z-index:30;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
@media (max-width:900px){
  .side{position:absolute;z-index:16;height:100%;left:0;top:0;box-shadow:var(--shadow-lg)}
  .side.closed{margin-left:0;transform:translateX(-100%);box-shadow:none}
  .backdrop{display:block;position:absolute;inset:0;background:var(--mask);z-index:15;opacity:0;pointer-events:none;transition:opacity .25s}
  .side:not(.closed)+.backdrop{opacity:1;pointer-events:auto}
  .dock{display:none!important}.pinned .rail{display:flex}
  .wrap{padding:0 16px}.chips{grid-template-columns:1fr}.top h1{font-size:14px}.hint{display:none}
}
.mask{position:fixed;inset:0;background:var(--mask);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
.dlg{width:min(620px,92vw);max-height:92vh;overflow:auto;background:var(--elev);border-radius:var(--r3);padding:22px 24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:6px;animation:rise .2s ease-out}
.dlg h3{margin:0 0 4px;font-size:16px}.dlg .fq{color:var(--sub);font-size:13px;margin-bottom:6px}
.dlg label{font-size:12px;color:var(--sub);margin-top:6px}.dlg label.ck{display:flex;gap:6px;align-items:center;color:var(--text)}
.dlg textarea,.dlg input:not([type]){background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--r1);padding:8px 10px;font:inherit;resize:vertical;outline:0;transition:border-color .15s,box-shadow .15s}
.dlg textarea:focus,.dlg input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dlg .ops{display:flex;gap:8px;align-items:center;margin-top:12px}.dlg .tip{flex:1;font-size:12px;color:var(--sub)}
.dlg .ops button{padding:7px 16px;border-radius:var(--r1);background:var(--hover)}.dlg .ops button:hover{background:var(--hover2)}
.dlg .ops .primary{background:var(--accent);color:#fff}.dlg .ops .primary:hover{background:var(--accent);opacity:.9}
@media (prefers-reduced-motion:reduce){.welcome .hero,.turn,.dlg{animation:none!important}.chips button,.side,.tobottom,.backdrop{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <img src="/static/logo.svg" alt="">
      <b id="sideTitle">研发知识库助手</b>
      <button class="icon" id="closeSide" title="收起侧栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15.5 10l-2 2 2 2"/></svg></button>
    </div>
    <div class="side-head">
      <button class="new" id="newChat" title="新对话（Ctrl/⌘+K）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>新对话</button>
    </div>
    <div class="tabs">
      <button data-tab="history" class="on">我的提问</button>
      <button data-tab="favorites">收藏</button>
      <button data-tab="board">问题榜单</button>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot"><div>由 Elon Chen 开发</div><div>© 2026 Elon Chen · All rights reserved</div></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <div class="top">
      <button class="icon" id="openSide" title="展开侧栏" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M13.5 10l2 2-2 2"/></svg></button>
      <h1 id="title">研发知识库助手</h1>
      <span class="grow"></span>
      <select id="project"><option value="">全部项目（自动识别）</option></select>
      <div class="seg" id="modeSeg"><button data-mode="rag" class="on" title="检索一次后回答，快">快速</button><button data-mode="agent" title="允许模型多次查资料，慢但更全">深度</button></div>
      <button class="icon" id="themeBtn" title="切换主题"></button>
    </div>
    <div class="body" id="bodyArea">
      <div class="thread" id="thread"><div class="wrap" id="turns">
        <div class="welcome" id="welcome"><img class="hero" src="/static/logo.svg" alt=""><h2>有什么可以帮你？</h2><div class="subt">回答只依据公司内部资料，每条结论带出处编号</div><div class="chips" id="examples"></div></div>
      </div></div>
      <nav class="rail" id="rail"><div class="pop" id="pop"></div></nav>
      <aside class="dock" id="dock"></aside>
      <button class="tobottom" id="toBottom" title="回到底部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    </div>
    <div class="composer"><div class="wrap">
      <div class="box"><textarea id="input" rows="1" placeholder="输入问题，向知识库提问"></textarea><button class="send" id="send" title="发送（Enter）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg><span class="spin"></span></button></div>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · / 聚焦 · Ctrl/⌘+K 新对话</div>
      <div class="notice">内容由 AI 基于公司内部资料生成，仅供参考，请以源码与正式文档为准 · 仅限公司内网使用，请勿外传涉密信息<span id="notice"></span></div>
    </div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="mask" id="fixMask" onclick="if(event.target===this)this.style.display='none'"><div class="dlg">
  <h3>纠正这个回答</h3>
  <div class="fq" id="fixQ"></div>
  <label>正确答案（支持 Markdown；写清楚关键步骤/参数即可）</label>
  <textarea id="fixAns" rows="7" placeholder="例如：需要在 diag_eth.xlsx 的 ComParameter 页设置 EnableUdsRequestEmpty=1 ……"></textarea>
  <label>正确出处（可选，每行一个：项目/路径 或 项目/路径:起始行-结束行）</label>
  <textarea id="fixFiles" rows="2" placeholder="LidarAssistant/src/swc/Dcm/Dcm.cpp:120-180"></textarea>
  <label>同一个问题的其他问法（可选，每行一个；写客户/现场的原话最有用）</label>
  <textarea id="fixAlts" rows="2" placeholder="刷写包的 CRC 怎么算&#10;升级时报校验失败是哪里校验的"></textarea>
  <label>补充说明（可选）</label>
  <input id="fixNote" placeholder="例如：这是 1.8.0 之后的新行为">
  <label class="ck"><input type="checkbox" id="fixNo"> 资料里本来就没有这块知识（需要新增）</label>
  <div class="ops"><span class="tip">提交后由管理员审核，通过后知识库自动学会，并加入回归测试</span>
    <button onclick="$('#fixMask').style.display='none'">取消</button><button class="primary" onclick="submitFix()">提交</button></div>
</div></div>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script src="/static/highlight.min.js"></script>
<script>
const $ = s => document.querySelector(s);
// 局域网 http 下没有 crypto.randomUUID（要求安全上下文），自己生成一个匿名身份
const CLIENT = localStorage.kbClient || (localStorage.kbClient = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const state = {mode: 'rag', turns: [], tab: 'history', busy: false, cur: -1};
const ICON = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  like: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 3 2l-1 5h6a2 2 0 0 1 2 2.3l-1.4 6.6A2 2 0 0 1 17.7 20H7"/></svg>',
  dislike: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 13V4h3v9zM17 13l-4 8a2 2 0 0 1-3-2l1-5H5a2 2 0 0 1-2-2.3l1.4-6.6A2 2 0 0 1 6.3 4H17"/></svg>',
  fav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/></svg>',
  fix: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>'
};

// 纠错：填正确答案 / 正确出处（项目/路径[:起-止]）/ 勾选“资料里本来就没有”，后端自动判定错因后进入管理员审核队列
let fixing = null;
function openFix(t) {
  fixing = t;
  $('#fixQ').textContent = t.question;
  ['#fixAns', '#fixFiles', '#fixNote', '#fixAlts'].forEach(s => $(s).value = '');
  $('#fixNo').checked = false;
  $('#fixMask').style.display = 'flex';
  $('#fixAns').focus();
}
async function submitFix() {
  const body = {qa_id: fixing.qa_id, answer: $('#fixAns').value, files: $('#fixFiles').value, note: $('#fixNote').value, alts: $('#fixAlts').value, no_material: $('#fixNo').checked};
  try {
    const r = await api('/api/feedback', {method: 'POST', body: JSON.stringify(body)});
    $('#fixMask').style.display = 'none';
    toast({A: '已提交：判定为“没检索到正确资料”', B: '已提交：判定为“资料找到了但理解错了”', C: '已提交：判定为“资料里缺这块知识”'}[r.category] || '已提交，等待审核');
  } catch (e) { toast(e.message); }
}

async function api(path, opt = {}) {
  const r = await fetch(path, {...opt, headers: {'Content-Type': 'application/json', 'X-Client': CLIENT, ...(opt.headers || {})}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 1600); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

// 复制：局域网 http 下 navigator.clipboard 不可用，回退到 execCommand
async function copyText(t, quiet) {
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;top:-1000px;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if (!quiet) toast('已复制');
}

// 代码块：外包一层，头部显示语言 + 复制按钮
function decorateCode(el) {
  el.querySelectorAll('pre').forEach(pre => {
    if (pre.parentElement.classList.contains('codebox')) return;
    const code = pre.querySelector('code');
    const m = code && /(?:^|\s)language-([\w+#.-]+)/.exec(code.className);
    const box = document.createElement('div'); box.className = 'codebox';
    const head = document.createElement('div'); head.className = 'codehead';
    const lang = document.createElement('span'); lang.textContent = m ? m[1] : 'code';
    const b = document.createElement('button'); b.type = 'button';
    const label = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制';
    b.innerHTML = label;
    b.onclick = async () => {
      await copyText((code || pre).innerText, true);
      b.textContent = '已复制'; clearTimeout(b._t); b._t = setTimeout(() => b.innerHTML = label, 1500);
    };
    head.append(lang, b);
    pre.replaceWith(box); box.append(head, pre);
  });
}

// Markdown → 安全 HTML；[n] 只在正文文本里替换成引用角标，代码块里的 [0] 之类保持原样
function renderMd(md, el) {
  el.innerHTML = DOMPurify.sanitize(marked.parse(md || ''));
  el.querySelectorAll('pre code').forEach(c => { try { hljs.highlightElement(c); } catch {} });
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest('code,pre') ? 2 : 1});
  const nodes = []; while (walker.nextNode()) if (/\[\d+\]/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(/\[(\d+)\]/g, '<span class="cite" data-n="$1">$1</span>');
    n.replaceWith(...span.childNodes);
  });
  decorateCode(el);
}

function srcLabel(s) {
  if (s.hidden) return `<span class="src" data-n="${s.n}"><b>[${s.n}]</b>${esc(s.project)}</span>`;
  return `<span class="src" data-n="${s.n}" title="${esc(s.project + '/' + s.path)}"><b>[${s.n}]</b>${esc(s.project)}/${esc(s.path)}:${s.start}-${s.end}</span>`;
}

function turnEl(t, i) {
  const el = document.createElement('section'); el.className = 'turn'; el.id = 'turn' + i;
  el.innerHTML = `<div class="q"><div>${esc(t.question)}</div></div><div class="who"><img src="/static/logo.svg" alt="">知识库助手</div><div class="a"></div>`;
  fillAnswer(el.querySelector('.a'), t);
  return el;
}

function fillAnswer(a, t) {
  if (t.pending) { a.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; return; }
  if (t.error) { a.innerHTML = `<div class="err">出错了：${esc(t.error)}</div>`; return; }
  a.innerHTML = '<div class="md"></div><div class="srcs"></div><div class="bar"></div>';
  renderMd(t.answer, a.querySelector('.md'));
  a.querySelector('.srcs').innerHTML = (t.sources || []).map(srcLabel).join('');
  a.querySelectorAll('.cite').forEach(c => {
    const s = (t.sources || []).find(x => String(x.n) === c.dataset.n);
    if (s) c.title = s.hidden ? s.project : `${s.project}/${s.path}:${s.start}-${s.end}`;
  });
  a.querySelectorAll('.cite').forEach(c => c.onclick = () => {
    const s = a.querySelector(`.src[data-n="${c.dataset.n}"]`); if (!s) return;
    s.classList.add('flash'); s.scrollIntoView({block: 'nearest'}); setTimeout(() => s.classList.remove('flash'), 1200);
  });
  const mine = t.mine || [];
  const bar = a.querySelector('.bar');
  bar.innerHTML = `<button class="copy" title="复制回答（Markdown）">${ICON.copy}<span>复制回答</span></button>
    <button class="like ${mine.includes('like') ? 'on' : ''}" title="有帮助">${ICON.like}<span>${t.likes || ''}</span></button>
    <button class="dislike ${mine.includes('dislike') ? 'on' : ''}" title="没帮助（会进入待补资料清单）">${ICON.dislike}</button>
    <button class="fav ${mine.includes('fav') ? 'on' : ''}" title="收藏">${ICON.fav}</button>
    <button class="fix" title="答错了/答不全？提交正确答案，管理员审核后知识库会学会">${ICON.fix}<span>纠错</span></button>
    <span class="sp"></span><span class="t">${t.seconds ? t.seconds + 's' : ''}</span>`;
  bar.querySelector('.copy').onclick = () => copyText(t.answer);
  bar.querySelector('.fix').onclick = () => openFix(t);
  ['like', 'dislike', 'fav'].forEach(k => bar.querySelector('.' + k).onclick = async () => {
    try {
      const r = await api('/api/vote', {method: 'POST', body: JSON.stringify({qa_id: t.qa_id, kind: k, on: !(t.mine || []).includes(k)})});
      Object.assign(t, r); fillAnswer(a, t);
      if (k === 'fav') { toast(r.mine.includes('fav') ? '已收藏' : '已取消收藏'); if (state.tab === 'favorites') loadTab(); }
    } catch (e) { toast(e.message); }
  });
}

function renderTurns() {
  const box = $('#turns');
  const old = box.querySelectorAll('.turn').length;
  $('#welcome').style.display = state.turns.length ? 'none' : '';
  box.querySelectorAll('.turn').forEach(e => e.remove());
  state.turns.forEach((t, i) => { const e = turnEl(t, i); if (i < old) e.classList.add('old'); box.appendChild(e); });
  renderRail();
}

// 右侧问题点轨：每个问题一个点；悬停展开列表；可固定为侧栏
function renderRail() {
  const items = state.turns.map((t, i) => `<button class="qitem ${i === state.cur ? 'cur' : ''}" data-i="${i}" title="${esc(t.question)}">${esc(t.question)}</button>`).join('');
  const head = (pinned) => `<div class="${pinned ? 'dock-head' : 'pop-head'}"><span>本次对话 ${state.turns.length} 个问题</span><button class="icon pinbtn" title="${pinned ? '取消固定' : '固定到侧边栏'}">${ICON.pin}</button></div>`;
  $('#rail').innerHTML = state.turns.map((t, i) => `<button class="dot ${i === state.cur ? 'cur' : ''}" data-i="${i}" aria-label="${esc(t.question)}"></button>`).join('') +
    `<div class="pop" id="pop">${head(false)}${items}</div>`;
  $('#rail').style.visibility = state.turns.length > 1 ? 'visible' : 'hidden';
  $('#dock').innerHTML = head(true) + items;
  document.querySelectorAll('.dot,.qitem').forEach(b => b.onclick = () => $('#turn' + b.dataset.i).scrollIntoView());
  document.querySelectorAll('.pinbtn').forEach(b => b.onclick = e => { e.stopPropagation(); togglePin(); });
}
function togglePin(on) {
  const v = on ?? !$('#bodyArea').classList.contains('pinned');
  $('#bodyArea').classList.toggle('pinned', v); localStorage.kbPinned = v ? '1' : '';
}
// 滚动时高亮当前所在问题
$('#thread').addEventListener('scroll', () => {
  const top = $('#thread').getBoundingClientRect().top + 80; let cur = -1;
  document.querySelectorAll('.turn').forEach((e, i) => { if (e.getBoundingClientRect().top < top) cur = i; });
  if (cur === -1 && state.turns.length) cur = 0;
  if (cur !== state.cur) { state.cur = cur; document.querySelectorAll('.dot,.qitem').forEach(b => b.classList.toggle('cur', +b.dataset.i === cur)); }
});

async function ask(question) {
  question = question.trim(); if (!question || state.busy) return;
  state.busy = true; $('#send').disabled = true; $('#send').classList.add('busy'); $('#input').value = ''; autoGrow();
  const t = {question, pending: true}; state.turns.push(t); state.cur = state.turns.length - 1; renderTurns();
  $('#turn' + state.cur).scrollIntoView();
  try {
    Object.assign(t, await api('/api/ask', {method: 'POST', body: JSON.stringify({question, project: $('#project').value || null, mode: state.mode})}));
  } catch (e) { t.error = e.message; }
  t.pending = false; state.busy = false; $('#send').disabled = false; $('#send').classList.remove('busy');
  const i = state.turns.indexOf(t); fillAnswer($('#turn' + i + ' .a'), t);
  if (state.tab === 'history') loadTab();
}

// 从历史/收藏/榜单打开一条已有回答：不重新生成，直接取库里那次的结果
async function openQa(id) {
  const exist = state.turns.findIndex(t => t.qa_id === id);
  if (exist >= 0) { $('#turn' + exist).scrollIntoView(); return; }
  try { const t = await api('/api/qa/' + id); state.turns.push(t); state.cur = state.turns.length - 1; renderTurns(); $('#turn' + state.cur).scrollIntoView(); }
  catch (e) { toast(e.message); }
}

function dayGroup(ts) {
  const d = new Date(ts * 1000), now = new Date(), diff = (new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5;
  return diff === 0 ? '今天' : diff === 1 ? '昨天' : diff < 7 ? '7 天内' : diff < 30 ? '30 天内' : '更早';
}
async function loadTab() {
  const list = $('#list');
  try {
    if (state.tab === 'board') {
      const {board, hot} = await api('/api/board');
      let h = '<div class="group">问题榜单（大家公认的高频问题）</div>';
      h += board.length ? board.map((b, i) => `<button class="item" data-id="${b.qa_id}" title="${esc(b.question)}"><span class="rank ${i < 3 ? 'top' : ''}">${i + 1}</span>${esc(b.question)}</button>`).join('')
        : '<div class="empty">暂无上榜问题。被多人问过且获赞的问题会自动上榜。</div>';
      h += '<div class="group">近期热门</div>' + (hot.length ? hot.map((x, i) => `<button class="item" data-id="${x.qa_id}" title="${esc(x.question)}"><span class="meta">${x.users}人</span><span class="rank">${i + 1}</span>${esc(x.question)}</button>`).join('') : '<div class="empty">暂无数据</div>');
      list.innerHTML = h;
    } else {
      const {items} = await api('/api/' + state.tab);
      if (!items.length) { list.innerHTML = `<div class="empty">${state.tab === 'favorites' ? '点击回答下方的星标即可收藏' : '还没有提问记录'}</div>`; return; }
      let h = '', g = '';
      items.forEach(x => { const gg = dayGroup(x.ts); if (gg !== g) { h += `<div class="group">${gg}</div>`; g = gg; } h += `<button class="item" data-id="${x.id}" title="${esc(x.question)}">${esc(x.question)}</button>`; });
      list.innerHTML = h;
    }
    list.querySelectorAll('.item').forEach(b => b.onclick = () => openQa(+b.dataset.id));
  } catch (e) { list.innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

function autoGrow() { const i = $('#input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 180) + 'px'; }
$('#input').addEventListener('input', autoGrow);
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask($('#input').value); } });
$('#send').onclick = () => ask($('#input').value);
$('#newChat').onclick = () => { state.turns = []; state.cur = -1; renderTurns(); $('#input').focus(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); state.tab = b.dataset.tab; loadTab();
});
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('on', x === b)); state.mode = b.dataset.mode;
});
function setSide(open, save = true) { $('#side').classList.toggle('closed', !open); $('#openSide').style.display = open ? 'none' : ''; if (save) localStorage.kbSide = open ? '' : 'closed'; }
$('#closeSide').onclick = () => setSide(false); $('#openSide').onclick = () => setSide(true);
// 窄屏浮层侧栏：点遮罩关闭（不记忆，避免影响宽屏偏好）
$('#backdrop').onclick = () => setSide(false, false);

// 主题：默认跟随系统，手动切换后记忆
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function applyTheme(t, save) {
  document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').innerHTML = t === 'dark' ? SUN : MOON;
  $('#themeBtn').title = t === 'dark' ? '切换到浅色' : '切换到深色';
  if (save) localStorage.kb_theme = t;
}
$('#themeBtn').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
applyTheme(document.documentElement.getAttribute('data-theme') || 'dark', false);

// 回到底部：上滚超过 300px 时出现
function updateToBottom() { const th = $('#thread'); $('#toBottom').classList.toggle('show', th.scrollHeight - th.scrollTop - th.clientHeight > 300); }
$('#thread').addEventListener('scroll', updateToBottom);
$('#toBottom').onclick = () => $('#thread').scrollTo({top: $('#thread').scrollHeight, behavior: 'smooth'});

// 快捷键：/ 聚焦输入，Ctrl/⌘+K 新对话，Esc 关闭纠错弹窗
document.addEventListener('keydown', e => {
  const tg = e.target, typing = tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName);
  if (e.key === 'Escape' && $('#fixMask').style.display === 'flex') { $('#fixMask').style.display = 'none'; return; }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#newChat').click(); return; }
  if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); $('#input').focus(); }
});

(async function init() {
  // 窄屏下侧栏是浮层，默认收起，避免盖住回答操作栏
  setSide(localStorage.kbSide !== 'closed' && innerWidth > 900, false); togglePin(!!localStorage.kbPinned);
  marked.setOptions({gfm: true, breaks: true});
  try {
    const c = await api('/api/config');
    document.title = c.title; $('#title').textContent = c.title; $('#sideTitle').textContent = c.title; $('#notice').textContent = c.notice || '';
    c.projects.forEach(p => $('#project').insertAdjacentHTML('beforeend', `<option value="${esc(p.name)}">${esc(p.label)}</option>`));
    if (!c.allow_agent_mode) $('#modeSeg').style.display = 'none';
    $('#examples').innerHTML = c.examples.map(e => `<button>${esc(e)}</button>`).join('');
    $('#examples').querySelectorAll('button').forEach(b => b.onclick = () => ask(b.textContent));
  } catch (e) { $('#notice').textContent = '服务连接失败：' + e.message; }
  renderTurns(); loadTab(); $('#input').focus();
})();
</script>
</body>
</html>
