# 知识源清单：只纳入“人写的、能回答问题的”内容。
# 客户资料（FAQ / 配置说明 / 配置样例）在 ~/kb-docs，见文件末尾的 *-客户资料 条目。
# 套路：先白名单子目录 + 扩展名，再黑名单构建产物/第三方/敏感文件。宁缺毋滥，噪声会直接拉低检索命中率。

[defaults]
extensions = [".cpp", ".cc", ".c", ".h", ".hpp", ".md", ".txt", ".py", ".cmake", ".sh", ".ps1", ".ini", ".yaml", ".yml", ".json"]
filenames = ["CMakeLists.txt", "README", "AGENTS.md"]
max_bytes = 400_000
exclude_dirs = ["build", "build_*", "3rd_party", "3rdParty", "3rdparty", "third_party", "spdlog", ".git", "release", "dist", "node_modules", "html", "out", "__pycache__", ".vs", ".idea"]
# 敏感内容一律不入库（密钥、证书、解密相关）
exclude_globs = ["*.key", "*.pem", "*.crt", "*.p12", "*secret*", "*password*", "*decrypt*", "*credential*", "*token*", "*apiurl*", "*remote_config*", ".env*", "compile_commands.json", "*.user", "*.user.*",
  # 第三方/生成代码：占块多、没人会问，反而挤占检索名额
  "*_rc.py", "qcustomplot.*", "tinyxml2.*", "json.hpp", "moc_*", "ui_*.h", "qrc_*"]

[[source]]
project = "LidarAssistant"
aliases = ["Lidar Assistant"]  # 问题里出现这些词就路由到本项目
root = "/home/sti/project/LidarAssistant"
include = ["src", "doc", "docs", "Docs", "cmake", "shader", ".cursor/skills", "README.md", "AGENTS.md", "CHANGLOG.md", "SWC_Data_Processing_LIDAR_中文版.md", "CMakeLists.txt", "compile_linux.sh"]

